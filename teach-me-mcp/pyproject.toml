[project]
name = "teach-me-mcp"
version = "0.2.0"
description = "MCP server handling the persistent memory of the teach-me skill, stored in an Obsidian vault"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.10",
    "pyyaml>=6.0",
]

[project.scripts]
teach-me-mcp = "teach_me.server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["teach_me"]
